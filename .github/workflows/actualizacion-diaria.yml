name: Actualización diaria de Mi Radar Musical

on:
  schedule:
    # GitHub suele retrasar (o saltarse) los avisos programados varias horas.
    # Por eso hay varios intentos al día: el primero que llegue a partir de las
    # 04:00 de Madrid hace la actualización y los siguientes ven que ya está hecha.
    - cron: "0 2,3,5,8,11,14,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizacion-diaria-radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decidir si toca actualizar
        id: decidir
        run: |
          hoy="$(TZ=Europe/Madrid date +%d/%m/%Y)"
          hora="$(TZ=Europe/Madrid date +%H)"
          ultima="$(cut -c1-10 app/ultima_actualizacion.txt 2>/dev/null || true)"
          echo "Hoy: $hoy · hora en Madrid: $hora · última actualización: ${ultima:-ninguna}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            toca=si
          elif [ "$ultima" != "$hoy" ] && [ "$((10#$hora))" -ge 4 ]; then
            toca=si
          else
            toca=no
          fi
          echo "Toca actualizar: $toca"
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

      - name: Actualizar artistas, radar y listas
        if: steps.decidir.outputs.toca == 'si'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app/actualizacion_programada.py

      - name: Registrar fecha de actualización completada
        if: steps.decidir.outputs.toca == 'si'
        run: |
          TZ=Europe/Madrid date '+%d/%m/%Y, %H:%M' > app/ultima_actualizacion.txt

      - name: Guardar los datos actualizados
        if: steps.decidir.outputs.toca == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- mi_radar_musical.csv lanzamientos.json portada.json app/portada.json app/listas_cache app/resumenes_musicales.json app/ultima_actualizacion.txt
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar Mi Radar Musical automáticamente"
            # La actualización tarda horas: si mientras tanto se subieron otros
            # cambios a main, se incorporan antes de enviar.
            git pull --rebase --autostash origin main
            git push
          fi
