name: Validar código Python

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**/*.py"
      - ".github/workflows/validar-codigo.yml"

permissions:
  contents: read

jobs:
  sintaxis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Comprobar sintaxis de Python
        run: python -m py_compile app/servidor.py app/actualizacion_programada.py app/preparar_resumenes.py
