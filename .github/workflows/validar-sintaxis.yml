name: Validar sintaxis Python

on:
  push:
  pull_request:

jobs:
  comprobar-sintaxis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar sintaxis
        run: python -m py_compile app/servidor.py app/listas_musicales.py
