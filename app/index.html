<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Radar Musical</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:35px auto;padding:0 18px;background:#10131b;color:#f2f4f8}
h1{color:#76e0c2}
input,select{padding:12px;margin:5px;border-radius:8px;border:1px solid #444;background:#202633;color:white}
#total{color:#aaa;margin:15px 5px}
.artista,.publicacion{padding:12px;margin:7px 0;background:#202633;border-radius:8px}.grupo-musicales{margin:16px 0;padding:12px;background:#171e2a;border:1px solid #46516a;border-radius:12px}.grupo-musicales>summary{cursor:pointer;font-weight:800;color:#bcb7ff;padding:8px}.grupo-musicales>.mensaje{margin:8px}.contenido-musicales{padding-top:5px}
.estado{color:#76e0c2;font-size:13px}
button{padding:10px;border-radius:8px;cursor:pointer;margin-top:8px}
.publicaciones{margin-top:12px;border-top:1px solid #444;padding-top:8px}
.fecha{color:#76e0c2;font-size:13px}
.mensaje{color:#bbb}
.foto-artista{display:block;width:220px;height:220px;max-width:100%;object-fit:cover;object-position:center;border-radius:10px;margin-top:12px;background:#202633}.credito-foto{font-size:11px;color:#aaa;margin-top:5px} .credito-foto a{color:#76e0c2}
#volver-portada{display:inline-block;margin:0 0 16px;padding:9px 13px;border-radius:8px;background:#202633;color:#76e0c2;text-decoration:none;border:1px solid #444}#volver-portada:hover{background:#2a3445}</style>
</head>
<body>
<a id="volver-portada" href="/">🏠 Volver a la portada principal</a>
<h1>Mi Radar Musical</h1>
<p>Busca tus artistas y consulta sus últimas publicaciones.</p>
<input id="buscar" placeholder="Buscar artista..." style="width:60%">
<select id="estado"><option value="">Todos los estados</option></select>
<div id="total">Cargando artistas...</div>
<div id="lista"></div>
<script>
let artistas=[];
const buscar=document.getElementById('buscar');
const estado=document.getElementById('estado');
const lista=document.getElementById('lista');
const total=document.getElementById('total');

const cacheImagenesArtista = new Map();
const observadorFotos = ('IntersectionObserver' in window)
 ? new IntersectionObserver(entradas => {
    for (const entrada of entradas) {
     if (!entrada.isIntersecting) continue;
     observadorFotos.unobserve(entrada.target);
     const foto = entrada.target.querySelector('.foto-artista');
     const credito = entrada.target.querySelector('.credito-foto');
     const nombre = entrada.target.querySelector('strong')?.textContent || '';
     if (foto && credito && nombre && nombre.trim().toUpperCase() !== 'ABBA') {
      cargarImagenArtista(nombre, foto, credito);
     }
    }
   }, {rootMargin:'250px'})
 : null;

async function buscarImagenEnWikipedia(nombre, idioma) {
 const parametros = new URLSearchParams({
  action:'query', generator:'search',
  gsrsearch:'"' + nombre + '" (cantante OR músico OR music OR singer)',
  gsrnamespace:'0', gsrlimit:'10',
  prop:'pageimages|info', piprop:'thumbnail',
  pithumbsize:'500', inprop:'url', format:'json', origin:'*'
 });
 const respuesta = await fetch('https://' + idioma + '.wikipedia.org/w/api.php?' + parametros.toString());
 if (!respuesta.ok) return null;
 const datos = await respuesta.json();
 const normalizar = texto => String(texto || '').normalize('NFD')
   .replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es').trim();
 const objetivo = normalizar(nombre);
 const paginas = Object.values(datos.query?.pages || {});
 // Solo aceptar la página del propio artista. Si no hay coincidencia clara,
 // dejar la foto vacía antes que mostrar una imagen de un lugar u otra persona.
 const pagina = paginas.find(p => {
  const titulo = normalizar(p.title);
  return p.thumbnail?.source &&
   (titulo === objetivo || titulo.startsWith(objetivo + ' ('));
 });
 if (!pagina) return null;
 return {
  imagen: pagina.thumbnail.source,
  titulo: pagina.title,
  url: pagina.fullurl || ('https://' + idioma + '.wikipedia.org/wiki/' + encodeURIComponent(pagina.title.replace(/ /g,'_')))
 };
}

async function cargarImagenArtista(nombre, foto, credito) {
 const clave = nombre.trim().toLocaleLowerCase('es');
 if (!cacheImagenesArtista.has(clave)) {
  cacheImagenesArtista.set(clave, (async()=>{
   for (const idioma of ['es','en']) {
    try {
     const resultado = await buscarImagenEnWikipedia(nombre, idioma);
     if (resultado) return resultado;
    } catch (error) {
     // Si una Wikipedia no responde, se prueba la otra.
    }
   }
   return null;
  })());
 }
 const resultado = await cacheImagenesArtista.get(clave);
 if (!resultado || !foto.isConnected) return;
 foto.src = resultado.imagen;
 foto.alt = 'Imagen de ' + nombre;
 foto.style.display = 'block';
 const enlace = document.createElement('a');
 enlace.href = resultado.url;
 enlace.target = '_blank';
 enlace.rel = 'noopener noreferrer';
 enlace.textContent = 'Fuente de la imagen: ' + resultado.titulo + ' (Wikipedia)';
 credito.textContent = '';
 credito.appendChild(enlace);
 credito.style.display = 'block';
}

function crearTarjetaArtista(a, destino){
  const nombreArtista=a.NombreOriginal||a.NombreNormalizado||'Sin nombre';
  const div=document.createElement('div');
  div.className='artista';
  const nombre=document.createElement('strong');
  nombre.textContent=nombreArtista;
  div.appendChild(nombre);
  if (nombreArtista.trim().toUpperCase() === 'ABBA') {
   const foto = document.createElement('img');
   foto.src = '/abba.jpg';
   foto.alt = 'ABBA en Schiphol en 1976';
   foto.className = 'foto-artista';
   div.appendChild(foto);
   const credito = document.createElement('div');
   credito.className = 'credito-foto';
   credito.innerHTML = 'Foto: Bert Verhoeff / Anefo · <a href="https://commons.wikimedia.org/wiki/File:ABBA_Schiphol_1976.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> · Licencia CC BY-SA 3.0 NL';
   div.appendChild(credito);
  } else {
   const foto = document.createElement('img');
   foto.className = 'foto-artista';
   foto.alt = 'Imagen de ' + nombreArtista;
   foto.loading = 'lazy';
   foto.style.display = 'none';
   div.appendChild(foto);
   const credito = document.createElement('div');
   credito.className = 'credito-foto';
   credito.style.display = 'none';
   div.appendChild(credito);
  }
  if(a.Estado){
   const est=document.createElement('div');
   est.className='estado';
   est.textContent=a.Estado;
   div.appendChild(est);
  }
  if(a.Observaciones){
   const obs=document.createElement('div');
   obs.textContent=a.Observaciones;
   div.appendChild(obs);
  }
  const boton=document.createElement('button');
  boton.textContent='Ver últimas publicaciones';
  boton.addEventListener('click',()=>cargarPublicaciones(nombreArtista,div));
  div.appendChild(boton);
  destino.appendChild(div);
  if (observadorFotos && nombreArtista.trim().toUpperCase() !== 'ABBA') observadorFotos.observe(div);
  else if (!observadorFotos && nombreArtista.trim().toUpperCase() !== 'ABBA') {
   const foto = div.querySelector('.foto-artista');
   const credito = div.querySelector('.credito-foto');
   if (foto && credito) cargarImagenArtista(nombreArtista, foto, credito);
  }
}

function mostrar(){
 if (observadorFotos) observadorFotos.disconnect();
 const q=buscar.value.toLocaleLowerCase('es').trim();
 const e=estado.value;
 const filtrados=artistas.filter(a=>
  (a.NombreOriginal||'').toLocaleLowerCase('es').includes(q) &&
  (!e || a.Estado===e)
 );
 const esReparto=a=>a.Estado==='Reparto o grupo pendiente' ||
  (a.NombreOriginal||'').trim().toLocaleLowerCase('es').startsWith('cast ');
 const musicales=filtrados.filter(esReparto);
 const artistasNormales=filtrados.filter(a=>!esReparto(a));
 total.textContent=artistasNormales.length+' artistas · '+musicales.length+' en «Musicales y repartos»';
 lista.replaceChildren();
 artistasNormales.forEach(a=>crearTarjetaArtista(a,lista));
 if(musicales.length){
  const grupo=document.createElement('details');
  grupo.className='grupo-musicales';
  const resumen=document.createElement('summary');
  resumen.textContent='🎭 Musicales y repartos ('+musicales.length+')';
  grupo.appendChild(resumen);
  const descripcion=document.createElement('p');
  descripcion.className='mensaje';
  descripcion.textContent='Repartos de películas, musicales y grupos de reparto agrupados para no mezclarlo todo con los artistas individuales.';
  grupo.appendChild(descripcion);
  const contenido=document.createElement('div');
  contenido.className='contenido-musicales';
  musicales.forEach(a=>crearTarjetaArtista(a,contenido));
  grupo.appendChild(contenido);
  lista.appendChild(grupo);
 }
}
async function cargarPublicaciones(nombre,contenedor){
 let zona=contenedor.querySelector('.publicaciones');
 if(zona){zona.remove();return;}
 zona=document.createElement('div');
 zona.className='publicaciones';
 zona.textContent='Cargando publicaciones...';
 contenedor.appendChild(zona);
 try{
  const r=await fetch('/api/publicaciones/'+encodeURIComponent(nombre));
  const datos=await r.json();
  if(!r.ok) throw new Error(datos.error||'No se pudieron cargar los datos');
  zona.innerHTML='';
  const titulo=document.createElement('h3');
  titulo.textContent='Últimas publicaciones de '+datos.artista+' ('+datos.total+' registradas)';
  zona.appendChild(titulo);
  if(!datos.publicaciones.length){
   zona.textContent='No hay publicaciones registradas.';
   return;
  }
  datos.publicaciones.forEach(p=>{
   const item=document.createElement('div');
   item.className='publicacion';
   const t=document.createElement('strong');
   t.textContent=p.titulo||'Sin título';
   item.appendChild(t);
   const detalle=document.createElement('div');
   detalle.className='fecha';
   detalle.textContent=[p.fecha||'Fecha desconocida',p.tipo||'Tipo desconocido'].join(' · ');
   item.appendChild(detalle);
   zona.appendChild(item);
  });
 }catch(error){
  zona.textContent=error.message;
 }
}

fetch('/api/artistas').then(r=>{
 if(!r.ok) throw new Error();
 return r.json();
}).then(datos=>{
 artistas=datos;
 [...new Set(artistas.map(a=>a.Estado).filter(Boolean))].sort().forEach(e=>{
  const op=document.createElement('option');
  op.value=e;op.textContent=e;estado.appendChild(op);
 });
 mostrar();
}).catch(()=>{
 total.textContent='No se ha podido cargar la lista. Comprueba que el servidor sigue abierto.';
});
buscar.addEventListener('input',mostrar);
estado.addEventListener('change',mostrar);
</script>
</body>
</html>
