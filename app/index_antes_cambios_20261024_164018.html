<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Radar Musical</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:35px auto;padding:0 18px;background:#10131b;color:#f2f4f8}
h1{color:#76e0c2}
input,select{padding:12px;margin:5px;border-radius:8px;border:1px solid #444;background:#202633;color:white}
#total{color:#aaa;margin:15px 5px}
.artista,.publicacion{padding:12px;margin:7px 0;background:#202633;border-radius:8px}
.estado{color:#76e0c2;font-size:13px}
button{padding:10px;border-radius:8px;cursor:pointer;margin-top:8px}
.publicaciones{margin-top:12px;border-top:1px solid #444;padding-top:8px}
.fecha{color:#76e0c2;font-size:13px}
.mensaje{color:#bbb}
.foto-artista{display:block;width:220px;max-width:100%;height:auto;border-radius:10px;margin-top:12px}.credito-foto{font-size:11px;color:#aaa;margin-top:5px} .credito-foto a{color:#76e0c2}
</style>
</head>
<body>
<h1>Mi Radar Musical</h1>
<p>Busca tus artistas y consulta sus últimas publicaciones.</p>
<input id="buscar" placeholder="Buscar artista..." style="width:60%">
<select id="estado"><option value="">Todos los estados</option></select>
<div id="total">Cargando artistas...</div>
<div id="lista"></div>
<script>
let artistas=[];
const buscar=document.getElementById('buscar');
const estado=document.getElementById('estado');
const lista=document.getElementById('lista');
const total=document.getElementById('total');

function mostrar(){
 const q=buscar.value.toLocaleLowerCase('es').trim();
 const e=estado.value;
 const filtrados=artistas.filter(a=>
  (a.NombreOriginal||'').toLocaleLowerCase('es').includes(q) &&
  (!e || a.Estado===e)
 );
 total.textContent=filtrados.length+' artistas';
 lista.innerHTML='';
 filtrados.forEach(a=>{
  const nombreArtista=a.NombreOriginal||a.NombreNormalizado||'Sin nombre';
  const div=document.createElement('div');
  div.className='artista';
  const nombre=document.createElement('strong');
  nombre.textContent=nombreArtista;
  div.appendChild(nombre);
  if (nombreArtista.trim().toUpperCase() === 'ABBA') {
   const foto = document.createElement('img');
   foto.src = '/abba.jpg';
   foto.alt = 'ABBA en Schiphol en 1976';
   foto.className = 'foto-artista';
   div.appendChild(foto);
   const credito = document.createElement('div');
   credito.className = 'credito-foto';
   credito.innerHTML = 'Foto: Bert Verhoeff / Anefo · <a href="https://commons.wikimedia.org/wiki/File:ABBA_Schiphol_1976.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> · Licencia CC BY-SA 3.0 NL';
   div.appendChild(credito);
  }
  if(a.Estado){
   const est=document.createElement('div');
   est.className='estado';
   est.textContent=a.Estado;
   div.appendChild(est);
  }
  if(a.Observaciones){
   const obs=document.createElement('div');
   obs.textContent=a.Observaciones;
   div.appendChild(obs);
  }

  const boton=document.createElement('button');
  boton.textContent='Ver últimas publicaciones';
  boton.addEventListener('click',()=>cargarPublicaciones(nombreArtista,div));
  div.appendChild(boton);
  lista.appendChild(div);
 });
}

async function cargarPublicaciones(nombre,contenedor){
 let zona=contenedor.querySelector('.publicaciones');
 if(zona){zona.remove();return;}
 zona=document.createElement('div');
 zona.className='publicaciones';
 zona.textContent='Cargando publicaciones...';
 contenedor.appendChild(zona);
 try{
  const r=await fetch('/api/publicaciones/'+encodeURIComponent(nombre));
  const datos=await r.json();
  if(!r.ok) throw new Error(datos.error||'No se pudieron cargar los datos');
  zona.innerHTML='';
  const titulo=document.createElement('h3');
  titulo.textContent='Últimas publicaciones de '+datos.artista+' ('+datos.total+' registradas)';
  zona.appendChild(titulo);
  if(!datos.publicaciones.length){
   zona.textContent='No hay publicaciones registradas.';
   return;
  }
  datos.publicaciones.forEach(p=>{
   const item=document.createElement('div');
   item.className='publicacion';
   const t=document.createElement('strong');
   t.textContent=p.titulo||'Sin título';
   item.appendChild(t);
   const detalle=document.createElement('div');
   detalle.className='fecha';
   detalle.textContent=[p.fecha||'Fecha desconocida',p.tipo||'Tipo desconocido'].join(' · ');
   item.appendChild(detalle);
   zona.appendChild(item);
  });
 }catch(error){
  zona.textContent=error.message;
 }
}

fetch('/api/artistas').then(r=>{
 if(!r.ok) throw new Error();
 return r.json();
}).then(datos=>{
 artistas=datos;
 [...new Set(artistas.map(a=>a.Estado).filter(Boolean))].sort().forEach(e=>{
  const op=document.createElement('option');
  op.value=e;op.textContent=e;estado.appendChild(op);
 });
 mostrar();
}).catch(()=>{
 total.textContent='No se ha podido cargar la lista. Comprueba que el servidor sigue abierto.';
});
buscar.addEventListener('input',mostrar);
estado.addEventListener('change',mostrar);
</script>
</body>
</html>
